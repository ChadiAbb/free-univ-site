<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./draw.js">
        window.onload = draw_table;
    </script>
    <script src="./navbar.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            position: relative;
            overflow: auto; min-height: 100%;
            height: 100vh;
        }
        article {
            position: absolute;
            background: red;
        }
        #beforeTable {
            display:flex;
        }
        #table {
            width: 100%;
            height: 80%;
            position: relative;
            border: 2px solid #333;
            display: block;
        }

        /* Si vous voulez que le calendrier prenne toute la hauteur de l'écran */
        #table.fullscreen {
            height: calc(100vh - 40px);
        }

        nav {
            margin-bottom: 20px;
        }

        nav ul {
            list-style-type: none;
            padding: 0;
        }

        nav ul li {
            display: inline;
            margin-right: 15px;
        }

        nav ul li a {
            text-decoration: none;
            color: #333;
            font-weight: bold;
        }

    </style>
    <title>Document</title>
</head>
<body width="100%" >
        <div>
            <button id="before">avant</button>
            <button id="after">après</button>
        </div>
        <div id="beforeTable">
        </div>
        <nav id="navbar"></nav>
        <div width="90%" height="80%" id="table">
        </div>
    <script>
        today = getMonday();
        document.getElementById("before").addEventListener("click", () => {
            today.setDate(today.getDate() - 7);
            fetchEvents();
            update();
        })
        document.getElementById("after").addEventListener("click", () => {
            today.setDate(today.getDate() + 7);
            fetchEvents();
            update();
        })

        window.addEventListener('resize', debounce(function() {
            update();
        }, 100));
        fetchEvents();
        update();
    </script>
</body>
</html>
